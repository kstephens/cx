    #!/usr/bin/env bash
    dir='ex/cmd/set-meta/b14ee374de5c2d7ec18e3cffb4af9f48'
    cp -p ex/data/*.* "$dir"
    export CX_RANDOM_SEED=1638854222
    PATH="$(/bin/pwd)/bin:$PATH"
    cd "$dir" || exit 9
    [[ -n "$CX_VERBOSE" ]] && set -x
    (
      cx in SOME.csv // -h // -meta // set-meta 'a:max_size=20;align=right' // md;
      echo $! > exit_code
    ) 2> stderr > actual
    [[ -f expected ]] || cp actual expected
    diff -u expected actual | (read _; read _; cat) > diff
    [[ ! -s diff ]]
