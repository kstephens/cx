contents: !ruby/struct:CX::Example::Files
  run: |
    #!/usr/bin/env bash
    dir='ex/cmd/stats/6e7a9205f7a3d958afcf0dda126bb098'
    cp -p ex/data/*.* "$dir"
    export CX_RANDOM_SEED=1638854222
    PATH="$(/bin/pwd)/bin:$PATH"
    cd "$dir" || exit 9
    [[ -n "$CX_VERBOSE" ]] && set -x
    (
      cx in stats-data.csv // -h // parse // stats dept:g job:g salary // cut dept,job,*_min,*_max // md;
      echo $! > exit_code
    ) 2> stderr > actual
    [[ -f expected ]] || cp actual expected
    diff -u expected actual | (read _; read _; cat) > diff
    [[ ! -s diff ]]
